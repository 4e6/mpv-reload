# Lint, and run the tests against real mpv builds.
#
# What we support is not a list of mpv versions but a list of distro RELEASES
# that people actually run, each with the mpv it ships:
#
#   - the newest Ubuntu LTS     (ubuntu:latest)
#   - the current Debian stable (debian:stable)
#   - the newest mpv, through Arch Linux (a rolling release, archlinux:latest)
#
# Each cell is a floating container tag, so none needs an edit when a release
# lands. A weekly scheduled run (Monday 06:32 UTC) re-tests every cell, so a distro
# release, or a new mpv release through Arch, that changes what a tag resolves to
# is caught within a week. A failed scheduled run is meant to alert the owner
# through a watch outside this repo. Scheduled runs only run on the default branch,
# and GitHub disables them after 60 days without repository activity, so a silent
# week may mean the schedule was switched off: re-enable it in the Actions tab.
# workflow_dispatch still allows a re-test by hand.
#
# Job names are the required status checks in the branch protection on `master`
# and are matched exactly: renaming a cell means updating protection too.
#
# If a new mpv release changes something the script relies on, the Arch cell fails
# first. Fix main.lua so the other cells keep passing.
#
# No cell is guaranteed to run an mpv older than 0.38 any more, so the old
# `loadfile` fallback in main.lua is no longer exercised by CI.
#
# No secrets and read-only permissions: fork pull requests run this too.
name: ci

on:
  schedule:
    - cron: '32 6 * * 1'
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # The event name keeps the weekly scheduled run (same ref as a push to master)
  # from being cancelled by a push: a cancelled run is not a failed one, so a
  # failure watch would never see it.
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  luacheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: lunarmodules/luacheck@v1

  test:
    name: ${{ matrix.name }}
    # Only hosts the container; the mpv under test comes from the matrix image.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        # One cell per supported release; see the top of this file before changing.
        include:
          - name: "Ubuntu LTS"
            container: ubuntu:latest
            install: apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y mpv ffmpeg python3
          - name: "Debian stable"
            container: debian:stable
            install: apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y mpv ffmpeg python3
          - name: "Arch Linux"
            container: archlinux:latest
            install: pacman -Syu --noconfirm mpv ffmpeg python
    steps:
      - uses: actions/checkout@v7
      - name: Install mpv and ffmpeg
        run: ${{ matrix.install }}
      - name: Show versions
        run: |
          mpv --version | head -n 2
          python3 --version
      - name: Run tests
        run: python3 tests/run.py
