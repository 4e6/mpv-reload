# Lint, and run the tests against real mpv builds.
#
# What we support is not a list of mpv versions but a list of RELEASES that people
# actually run, each with the mpv it ships:
#
#   - the supported Ubuntu LTS release   (24.04 ships mpv 0.37, the last one with
#                                          the old `loadfile` syntax)
#   - the current Debian stable release  (13 "trixie" ships mpv 0.40)
#   - the newest mpv, through Arch Linux (a rolling release)
#
# The mpv numbers in the job names are only what those releases ship today. Keep
# the cells in step with the releases, not with mpv:
#
#   - A new Ubuntu LTS or Debian stable comes out, or one reaches end of support:
#     add or replace its cell (container or runner image, install line, job name).
#     Job names are the required status checks in the branch protection on
#     `master` and are matched exactly, so change them there as well.
#   - Arch needs no edit: its image is rolling and always has the newest mpv. After
#     a new mpv release, run this workflow by hand (workflow_dispatch) to re-test
#     "latest". The web-watcher alert for new mpv releases says when.
#   - If a new mpv release changes something the script relies on (0.38 did, for
#     `loadfile`), the "latest" cell fails first. Fix main.lua so the older cells
#     keep passing.
#
# No secrets and read-only permissions: fork pull requests run this too.
name: ci

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  luacheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: lunarmodules/luacheck@v1

  test:
    name: mpv ${{ matrix.name }}
    # Pinned: ubuntu-latest will move to a release that ships a newer mpv, and
    # the old-syntax cell would silently disappear.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        # One cell per supported release; see the top of this file before changing.
        include:
          - name: "0.37 (Ubuntu 24.04)"
            container: ""
            install: sudo apt-get update && sudo apt-get install -y mpv ffmpeg
          - name: "0.40 (Debian 13)"
            container: debian:trixie
            install: apt-get update && apt-get install -y mpv ffmpeg python3
          - name: "latest (Arch Linux)"
            container: archlinux:latest
            install: pacman -Syu --noconfirm mpv ffmpeg python
    steps:
      - uses: actions/checkout@v7
      - name: Install mpv and ffmpeg
        run: ${{ matrix.install }}
      - name: Show versions
        run: |
          mpv --version | head -n 2
          python3 --version
      - name: Run tests
        run: python3 tests/run.py
